[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finshybrid"
version = "0.1.0"
description = "Fossen + G1 learned residual + online velocity bias: portable research reference"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
train = ["torch>=2.2,<3"]
mpc = ["scipy>=1.10,<2"]
plot = ["matplotlib>=3.7,<4"]
dev = ["pytest>=8,<9"]

[project.scripts]
finshybrid-demo = "finshybrid.demo:main"
finshybrid-train = "finshybrid.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finshybrid = ["assets/*/*.json", "native/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
